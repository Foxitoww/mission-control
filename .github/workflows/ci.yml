name: ci

# Porte de qualité : tout ce qui vise `main` doit d'abord passer ici.
on:
  push:
    branches: [Dev]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Les tests tournent sous Node avec SQLite en mémoire : le binaire Electron
      # (~100 Mo) ne sert à rien ici et ne ferait qu'allonger chaque exécution.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
