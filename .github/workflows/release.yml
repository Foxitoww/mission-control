name: release

# Déclenché par un tag de version. C'est le sens concret de « mise à jour liée à
# git » : poser un tag publie une release, et les applications installées la
# découvrent via latest.yml.
on:
  push:
    tags: ['v*']
  # Déclenchement manuel : rejouer la publication sur une branche sans
  # consommer un numéro de version, le temps que la chaîne Windows soit verte.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    # Épinglé, pas « latest » : l'image 2025 embarque Visual Studio 18, que le
    # node-gyp de better-sqlite3 ne sait pas reconnaître (« could not find a
    # version of Visual Studio 2017 or newer »). 2022 porte une chaîne MSVC que
    # le repli de compilation comprend, si jamais le binaire prébuild manque.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Python 3.11, pas la 3.12 de l'image : le node-gyp 9.4.1 embarqué par
      # better-sqlite3 importe `distutils`, retiré de la stdlib en 3.12
      # (« ModuleNotFoundError: No module named 'distutils' »). C'est le repli
      # de compilation ; il ne sert que si le binaire prébuild manque.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # GITHUB_TOKEN ici aussi : better-sqlite3 récupère son binaire prébuild
      # (N-API, donc valable pour Node ET Electron) depuis les releases GitHub.
      # Sans jeton, l'API anonyme peut throttler et forcer une compilation.
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # La porte de qualité vaut aussi pour une release : on ne publie pas un
      # binaire dont les tests d'isolation n'ont pas été rejoués.
      - run: npm test

      - run: npm run package -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
